# Canonical conference-track OCQR protocol. Paths are supplied at launch time.
experiment:
  suite: conference_v0_3
  dataset: retinamnist
  dataset_contract_version: "0.2.0"
  method: ocqr
  method_version: "0.3.0"
  output_root: results/conference_v0_3
method:
  name: ocqr
  version: "0.3.0"
seed: 0
seeds: [0, 1, 2, 3, 4]
alpha: 0.10
data:
  split_policy: official_train_stratified_train_calibration_v1
  split_seed: 0
  class_count: 5
  thresholds: [0.5, 1.5, 2.5, 3.5]
  numeric_target: "Z = Y_ord"
  ordinal_label: supplied_dataset_label
model_selection:
  quantile: validation_total_pinball_loss
  classification: validation_cross_entropy
methods: [lac, aps, oaps, copoc, ocqr]
baseline_requirements:
  common_evaluator: true
  lac:
    version: "1.0.0-exact-split"
    score: one_minus_true_class_probability
    calibration: pooled_exact_augmented_rank
    prediction_rule: probability_superlevel_set
    inclusion: non_strict
  aps:
    version: "1.0.0-nonrandomized-boundary"
    score: cumulative_probability_through_true_label
    calibration: pooled_exact_augmented_rank
    prediction_rule: smallest_stable_probability_prefix_reaching_q
    probability_tie_rule: ascending_class_index
  oaps:
    version: "1.0.0-lu2022-algorithm1"
    set_family: greedy_mode_centered_adjacent_expansion
    calibration: pooled_exact_augmented_rank
    mode_tie_rule: lowest_class
    adjacent_tie_rule: upper_right
  copoc:
    version: "1.0.0-eq5-aps"
    model_type: resnet18_copoc_nonparametric_eq5
    phi: abs
    psi_even: negative_abs
    conformal_procedure: aps
    checkpoint_selection: validation_cross_entropy
ablations: [ocqr_pooled, ocqr_no_hull, ocqr_no_fallback, ocqr_raw, ocqr_nonnegative_correction]
ocqr:
  quantiles: [0.05, 0.95]
  calibration: true_label_mondrian
  candidate_corrections: true
  fallback: full_label_space
  ordinal_hull: true
