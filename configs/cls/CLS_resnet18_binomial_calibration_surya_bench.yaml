seed: 42
hydra:
  run:
    dir: .

experiment:
  task: classification
  ckpt_file_name: resnet18_binomial_cls_oaps_calibration

data:
  repo: nasa-ibm-ai4science/surya-bench-flare-forecasting
  ref_mask_img: null
  flare_index:
    path: ${oc.env:SURYA_INDEX_DIR}
    train: train.csv
    val: validation.csv
    test: test.csv
    cal: leaky_validation.csv
    sha256:
      train: 2ec7b8f39367f8340a39889bc66525aff303410d7b7ce6c12a55ea346b55e865
      val: 803d2e5584fe9bbe23bc02cbed1b06fb47520e4863c2b22b5f09f9d5c654c658
      cal: 03134a82a53891d25761774c5aad52f77e01673195f7cfd28c0dc061bfe5849e
      test: 40ddef01aebe23e5ee460717a08b7392827eacca2852af074d5f1533f59ebd4b
  input_zarr_path: ${oc.env:SURYA_ZARR_PATH}
  input_time_delta: [0]
  input_stat_path: ${oc.env:SURYA_STATS_PATH,./assets/stats/los_mag_stat.yaml}
  label_type: max_goes_class
  filter_numeric_target_column: max_intensity
  fq_max_intensity_exclusion_threshold: 1.0e-7
  excluded_goes_classes: [M0.9]
  limb_mask_path: ${oc.env:SURYA_LIMB_MASK_PATH,./assets/limb_mask.npy}
  target_norm_type: multi_class
  channels: null
  expected_channels: 13
  expected_image_size: [224, 224]
  require_per_channel_stats: true
  apply_limb_mask: true
  limb_mask_channels: []
  limb_mask_channel_prefixes: []
  num_workers: 6
  batch_size: 64
  pin_memory: true

check_point:
  model_type: resnet18_binomial
  base: ./assets/checkpoints/cls/
  resnet18_binomial_cls: null # Will be updated with the trained checkpoint

uc:
  csv_path: ./assets/uc_results/
  significance_level: 0.1
  methods: [oaps, min_cps, min_rcps, binomial_lac, risk_control]
  num_classes: 5
  class_wise: true
  class_mapping: {"FQ": 0, "B": 1, "C": 2, "M": 3, "X": 4}
  thresholds: [0.5, 1.5, 2.5, 3.5]
  
trainer:
  accelerator: gpu
  devices: 1
  num_nodes: 1
  precision: 32

wandb:
  save_dir: ./assets
  entity: gsu-dmlab
  project: uncertainty-flare-classification
