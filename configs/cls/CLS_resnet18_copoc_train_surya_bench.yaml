seed: 0
defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
hydra:
  output_subdir: null
  run: {dir: .}
experiment:
  task: classification
  ckpt_file_name: resnet18_copoc_surya_bench
data:
  repo: nasa-ibm-ai4science/surya-bench-flare-forecasting
  label_type: max_goes_class
  target_norm_type: multi_class
  flare_index:
    path: ${oc.env:SURYA_INDEX_DIR}
    train: train.csv
    val: validation.csv
    test: test.csv
  input_zarr_path: ${oc.env:SURYA_ZARR_PATH}
  input_time_delta: [0]
  input_stat_path: ./assets/stats/los_mag_stat.yaml
  channel: hmi_m
  num_workers: 6
  batch_size: 256
  pin_memory: true
model:
  save_ckpt_path: ./assets/checkpoints/copoc/
  ckpt: null
  module_type: cls
  type: resnet18_copoc
  resnet18_copoc: {in_channels: 1, time_steps: 1, num_classes: 5, p_drop: 0.5}
  loss: {type: cross_entropy}
optimizer: {type: adamw, lr: 5.0e-5, weight_decay: 0.01}
scheduler:
  use: cosine_warmup
  monitor: val_loss
  cosine_warmup: {total_steps: 1000, warmup_ratio: 0.1}
  plateau: {mode: min, factor: 0.1, patience: 10}
trainer: {accelerator: gpu, devices: 1, num_nodes: 1, max_epochs: 300, precision: 32, log_every_n_steps: 50, limit_train_batches: null, limit_val_batches: null, strategy: auto}
copoc: {version: "1.0.0-eq5-aps", phi: abs, psi_even: negative_abs, conformal_procedure: aps}
wandb: {save_dir: ./assets, entity: gsu-dmlab, project: uncertainty-flare-classification, offline: false, log_model: false, save_code: false, notes: canonical COPOC Eq. 5, tag: [resnet18, copoc, solar_flare]}
