seed: 0
experiment: {task: classification, ckpt_file_name: resnet18_copoc_calibration_surya_bench}
data:
  repo: nasa-ibm-ai4science/surya-bench-flare-forecasting
  flare_index:
    path: ${oc.env:SURYA_INDEX_DIR}
    train: train.csv
    val: validation.csv
    test: test.csv
    cal: leaky_validation.csv
  input_zarr_path: ${oc.env:SURYA_ZARR_PATH}
  input_time_delta: [0]
  input_stat_path: ${oc.env:SURYA_STATS_PATH,./assets/stats/los_mag_stat.yaml}
  limb_mask_path: ${oc.env:SURYA_LIMB_MASK_PATH,./assets/limb_mask.npy}
  label_type: max_goes_class
  filter_numeric_target_column: max_intensity
  fq_max_intensity_exclusion_threshold: 1.0e-7
  excluded_goes_classes: [M0.9]
  target_norm_type: multi_class
  channels: null
  expected_channels: 13
  expected_image_size: [224, 224]
  require_per_channel_stats: true
  apply_limb_mask: true
  limb_mask_channels: []
  limb_mask_channel_prefixes: []
  num_workers: 6
  batch_size: 64
  pin_memory: true
check_point:
  model_type: resnet18_copoc
  base: ./assets/checkpoints/copoc/
  resnet18_copoc_cls: REQUIRED_FRESH_COPOC_CHECKPOINT
uc:
  csv_path: ./outputs/conference_v0_3/solar_flare/copoc/
  significance_level: 0.1
  methods: [copoc]
  num_classes: 5
  class_wise: false
  class_mapping: {"FQ": 0, "B": 1, "C": 2, "M": 3, "X": 4}
copoc: {version: "1.0.0-eq5-aps", phi: abs, psi_even: negative_abs, conformal_procedure: aps}
trainer: {accelerator: gpu, devices: 1, num_nodes: 1, precision: 32}
