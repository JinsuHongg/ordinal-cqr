seed: 0
defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
hydra:
  output_subdir: null
  run: {dir: .}
experiment:
  task: classification
  ckpt_file_name: resnet18_copoc_utkface
data:
  repo: utkface
  label_type: ordinal
  num_workers: 4
  batch_size: 32
  pin_memory: true
model:
  save_ckpt_path: ./assets/checkpoints/copoc/
  ckpt: null
  module_type: cls
  type: resnet18_copoc
  resnet18_copoc: {in_channels: 3, time_steps: 1, num_classes: 5, p_drop: 0.5}
  loss: {type: cross_entropy}
optimizer: {type: adamw, lr: 1.0e-4, weight_decay: 0.01}
scheduler:
  use: cosine_warmup
  monitor: val_loss
  cosine_warmup: {total_steps: 1000, warmup_ratio: 0.1}
  plateau: {mode: min, factor: 0.1, patience: 5}
trainer: {accelerator: gpu, devices: 1, num_nodes: 1, max_epochs: 100, precision: 32, log_every_n_steps: 10, limit_train_batches: null, limit_val_batches: null, strategy: auto}
copoc: {version: "1.0.0-eq5-aps", phi: abs, psi_even: negative_abs, conformal_procedure: aps}
wandb: {save_dir: ./assets, entity: gsu-dmlab, project: uncertainty-medmnist-classification, offline: false, log_model: false, save_code: false, notes: canonical COPOC Eq. 5, tag: [resnet18, copoc, utkface]}
