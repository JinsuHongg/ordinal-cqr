seed: 0
defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

experiment:
  task: regression
  ckpt_file_name: resnet18_qr

data:
  repo: nasa-ibm-ai4science/surya-bench-flare-forecasting
  ref_mask_img: null
  flare_index:
    path: ${oc.env:SURYA_INDEX_DIR}
    train: train.csv
    val: validation.csv
    cal: leaky_validation.csv
    test: test.csv
    sha256:
      train: 2ec7b8f39367f8340a39889bc66525aff303410d7b7ce6c12a55ea346b55e865
      val: 803d2e5584fe9bbe23bc02cbed1b06fb47520e4863c2b22b5f09f9d5c654c658
      cal: 03134a82a53891d25761774c5aad52f77e01673195f7cfd28c0dc061bfe5849e
      test: 40ddef01aebe23e5ee460717a08b7392827eacca2852af074d5f1533f59ebd4b
  input_zarr_path: ${oc.env:SURYA_ZARR_PATH}
  input_time_delta: [0] #[-60, 0]
  input_stat_path: ${oc.env:SURYA_STATS_PATH,./assets/stats/los_mag_stat.yaml}
  label_type: max_intensity
  filter_numeric_target_column: max_intensity
  ordinal_label_type: max_goes_class
  fq_max_intensity_exclusion_threshold: 1.0e-7
  excluded_goes_classes: [M0.9]
  limb_mask_path: ${oc.env:SURYA_LIMB_MASK_PATH,./assets/limb_mask.npy}
  target_norm_type: log
  # Null selects every channel stored in the stacked 224x224 Surya Zarr array.
  channels: null
  expected_channels: 13
  expected_image_size: [224, 224]
  require_per_channel_stats: true
  apply_limb_mask: true
  limb_mask_channels: []
  limb_mask_channel_prefixes: []
  # for dataloader
  num_workers: 6
  batch_size: 64
  pin_memory: true

model:
  save_ckpt_path: ./assets/checkpoints/qr/
  ckpt: null
  module_type: qr # mcp, qr
  # module specific
  mcp:
    num_forwards: 100
  qr:
    quantiles: [0.05, 0.5, 0.95]
  
  # base model
  type: resnet18
  resnet18:
    in_channels: 13
    time_steps: 1
    p_drop: 0.5
    
  loss:
    type: pinball

optimizer:
  type: adamw
  lr: 5e-5
  weight_decay: 0.01

scheduler:
    use: cosine_warmup # The switch
    monitor: val_loss 
    # Define available strategies
    cosine_warmup:
      total_steps: 1000
      warmup_ratio: 0.1 # Default 10% warmup
    plateau:
      mode: min
      factor: 0.1
      patience: 10

trainer:
  accelerator: gpu
  devices: 1
  num_nodes: 1
  max_epochs: 300
  precision: 32
  log_every_n_steps: 50
  limit_train_batches: null
  limit_val_batches: null
  strategy: auto
  deterministic: true
  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 3
    min_delta: 0.0

wandb:
  save_dir: ./assets
  entity: gsu-dmlab
  project: uncertainty-flare-regression
  log_model: false
  notes: Resnet18 backbone and QR
  offline: false
  save_code: false
  tag: ["resnet18", "qr", "reg"] # backbone model, head type, task
