[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ordinal-cqr"
version = "0.3.0"
description = "Ordinal Conformalized Quantile Regression (OCQR) for class-conditional contiguous ordinal prediction sets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=2.2",
    "pandas",
    "pyyaml",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "loguru>=0.7.3",
    "pillow",
    "scikit-learn",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "lightning>=2.1.0",
    "torchmetrics>=1.0",
    "medmnist",
    "xarray",
    "dask",
    "zarr<3",
    "wandb",
]

[project.optional-dependencies]
laplace = ["laplace-torch>=0.2.2.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
